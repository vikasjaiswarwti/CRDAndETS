# ETS container nginx. APIs are NOT proxied here — the gateway owns them.
#
# PHASE 2: keep using your CURRENT ETS container, just remove its published port
#          and attach it to commutr-net as "ets-web".
# PHASE 3: use this config + Dockerfile (app served under /ets/).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    location = /ets/index.html {
        add_header Cache-Control "no-cache";
    }

    location /ets/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /ets/ {
        try_files $uri $uri/ /ets/index.html;
    }
}
