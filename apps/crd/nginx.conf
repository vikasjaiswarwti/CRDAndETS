server {
    listen 80;
    root /usr/share/nginx/html;

    location = /crd/index.html {
        add_header Cache-Control "no-cache";
    }

    location /crd/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /crd/ {
        try_files $uri $uri/ /crd/index.html;
    }
}
